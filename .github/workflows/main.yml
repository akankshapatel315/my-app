name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/my-app-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/my-app-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/my-app-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/my-app-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: self-hosted   # this MUST run on your laptop, GitHub's servers can't reach minikube
    steps:
      - name: Log in to GHCR (so minikube/docker can pull)
        run: echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull new images into local docker
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/my-app-backend:${{ github.sha }}
          docker pull ghcr.io/${{ github.repository_owner }}/my-app-frontend:${{ github.sha }}

      - name: Load images into minikube
        run: |
          minikube image load ghcr.io/${{ github.repository_owner }}/my-app-backend:${{ github.sha }}
          minikube image load ghcr.io/${{ github.repository_owner }}/my-app-frontend:${{ github.sha }}

      - name: Update deployments
        run: |
          kubectl set image deployment/backend backend=ghcr.io/${{ github.repository_owner }}/my-app-backend:${{ github.sha }} -n my-app
          kubectl set image deployment/frontend frontend=ghcr.io/${{ github.repository_owner }}/my-app-frontend:${{ github.sha }} -n my-app

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/backend -n my-app
          kubectl rollout status deployment/frontend -n my-app